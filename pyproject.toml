[project]
name = "llm-drug-response"
version = "0.1.0"
description = "Exploratory cold-start drug-response evaluation of LLM pharmacological annotations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.5",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "rdkit==2026.3.6",
  "pyarrow==25.0.1",
  "requests==2.34.2",
  "threadpoolctl==3.6.0",
  "python-dotenv>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]